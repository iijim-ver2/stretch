<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ストレッチタイマー</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container state-stopped" id="app-container">
      <section class="display-section">
        <h1 id="status">準備完了です</h1>
        <div id="timer" class="timer-text">30.0</div>
      </section>

      <section class="controls-section">
        <div class="main-controls">
          <button id="btn-toggle">スタート</button>
          <button id="btn-skip" class="btn-skip hidden">スキップ</button>
          <button id="btn-share" class="btn-share hidden">Twitterに投稿</button>
        </div>
        <button id="btn-pip" class="btn-secondary">PiPで表示</button>
      </section>

      <section class="list-section">
        <ul class="exercise-list" id="exercise-list"></ul>
      </section>
    </main>

    <div class="pip-resources hidden">
      <canvas id="pip-canvas" width="400" height="400"></canvas>
      <video id="pip-video" autoplay muted playsinline></video>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
